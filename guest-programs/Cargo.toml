[profile.release]
lto = "fat"
panic = "abort"
opt-level = 3
codegen-units = 1
debug = true

[profile.no-lto]
inherits = "release"
lto = false

[workspace]
resolver = "2"
members = [
    # Examples:
    "example-hello-world",

    # Benchmarks:
    "bench-minimal",
    "bench-memset",
    "bench-ed25519",
    "bench-ed25519-zebra",
    "bench-sr25519",
    "bench-ecdsa-k256",
    "bench-ecdsa-libsecp",
    "bench-recover-k256",
    "bench-recover-libsecp",
    "bench-blake2-128",
    "bench-blake2-256",
    "bench-blake2-256-asm",
    "bench-keccak-256",
    "bench-keccak-512",
    "bench-sha2-256",
    "bench-twox-64",
    "bench-twox-128",
    "bench-twox-256",
    "bench-pinky",
    "bench-prime-sieve",

    # Utilities
    "simplealloc",

    # Tests
    "test-blob",
    "test-blake2-asm",
]

[workspace.dependencies]
picoalloc = { version = "5.0.0", no-default-features = true }

[workspace.lints.rust]
unexpected-cfgs = "allow"
static_mut_refs = "allow"
