[package]
name = "bench-twox-256"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bench_twox_256"
path = "src/main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "bench-twox-256"
path = "src/main.rs"

[dependencies]
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
picoalloc = { workspace = true }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = { path = "../../crates/polkavm-derive" }

[features]
# Link compiler_builtins' word-wise memcpy/memset (what real-world guests get).
default = ["builtins-mem"]
builtins-mem = []

[lints]
workspace = true
