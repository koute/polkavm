[package]
name = "bench-keccak-256"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bench_keccak_256"
path = "src/main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "bench-keccak-256"
path = "src/main.rs"

[dependencies]
sha3 = { version = "0.10", default-features = false }
picoalloc = { workspace = true }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = { path = "../../crates/polkavm-derive" }

[features]
# Link compiler_builtins' word-wise memcpy/memset (what real-world guests get).
default = ["builtins-mem"]
builtins-mem = []

[lints]
workspace = true
