[package]
name = "bench-recover-k256"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bench_recover_k256"
path = "src/main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "bench-recover-k256"
path = "src/main.rs"

[dependencies]
# What sp_core::ecdsa uses in no_std runtimes.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }
picoalloc = { workspace = true }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = { path = "../../crates/polkavm-derive" }

[features]
# Link compiler_builtins' word-wise memcpy/memset (what real-world guests get).
default = ["builtins-mem"]
builtins-mem = []

[lints]
workspace = true
